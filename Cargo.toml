[workspace]
members = ["crates/json2md", "crates/json2md-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/sformisano/json2md"
license = "MIT OR Apache-2.0"
publish = ["crates-io"]

[workspace.dependencies]
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
